name: Update Google Scholar stats

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install scholarly beautifulsoup4 requests

      - name: Fetch Scholar stats
        run: python .github/scripts/update_scholar.py

      - name: Commit updated stats (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          if git diff --cached --quiet; then
            echo "stats.json unchanged - nothing to commit"
          else
            git commit -m "chore: sync Google Scholar citations & h-index"
            git push
          fi
