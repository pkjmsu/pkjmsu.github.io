name: Prepare Paras Patel portrait WebP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    if: contains(github.event.head_commit.message, 'Finalize Paras Patel portrait WebP')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reproduce the existing portrait crop from the original JPEG
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          source = "assets/people/paras-patel.jpg"
          target = "assets/people/paras-patel.webp"
          with Image.open(source) as original:
              image = ImageOps.exif_transpose(original).convert("RGB")
              # Reproduce the previous 120x156 CSS crop:
              # width:210%; left:-30%; top:-76%.
              scale = (120 * 2.1) / image.width
              x0 = round(36 / scale)
              y0 = round((156 * 0.76) / scale)
              x1 = round(156 / scale)
              y1 = round((156 * 0.76 + 156) / scale)
              portrait = image.crop((x0, y0, x1, y1)).resize((480, 624), Image.Resampling.LANCZOS)
              portrait.save(target, "WEBP", quality=92, method=6)
          print(f"Created portrait-cropped {target} from the original JPEG")
          PY
      - name: Update page markup and remove the old CSS crop
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("group-members.html")
          html = page.read_text(encoding="utf-8")
          old = '<span class="student-photo paras-portrait"><img src="assets/people/paras-patel.webp" alt="Paras Patel" loading="lazy"></span>'
          new = '<img class="student-photo" src="assets/people/paras-patel.webp" alt="Paras Patel" width="120" height="156" loading="lazy">'
          if old not in html:
              raise SystemExit("Expected old Paras portrait markup not found")
          page.write_text(html.replace(old, new), encoding="utf-8")
          style = Path("css/style.css")
          css = style.read_text(encoding="utf-8")
          css, count = re.subn(r'\.student-photo\.paras-portrait\{[^}]*\}\.paras-portrait img\{[^}]*\}', '', css)
          if count != 1:
              raise SystemExit(f"Expected one Paras-specific CSS crop rule, found {count}")
          style.write_text(css, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/people/paras-patel.webp group-members.html css/style.css
          git commit -m "Convert original Paras Patel JPEG to WebP"
          git push
