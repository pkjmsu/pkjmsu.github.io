name: Prepare Meet Shah passport portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  crop-portrait:
    if: contains(github.event.head_commit.message, 'Prepare Meet Shah passport crop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Crop portrait and optimize WebP
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          path = "assets/people/meet-shah.webp"
          image = Image.open(path).convert("RGB")
          # Passport-style head-and-shoulders crop; keep the full head and shoulders.
          cropped = image.crop((24, 18, 204, 252)).resize((360, 468), Image.Resampling.LANCZOS)
          cropped.save(path, "WEBP", quality=90, method=6)
          PY
      - name: Commit optimized portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/people/meet-shah.webp
          git commit -m "Crop Meet Shah portrait to passport framing"
          git push
